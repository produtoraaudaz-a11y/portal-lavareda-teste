<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151514">
  <title>AUDAZ — Portal do Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand-block"><div class="audaz-mark"><span class="record-dot"></span><strong>AUDAZ</strong><small>PRODUTORA</small></div></div>
      <nav id="sideNav" class="side-nav"></nav>
      <div class="sidebar-bottom">
        <button class="help-card" data-nav="arquivos"><span class="eyebrow">PRECISA DE ALGO?</span><strong>Fale com a Audaz.</strong><small>Arquivos e suporte em um só lugar.</small><span class="arrow">→</span></button>
        <div class="theme-switcher" aria-label="Aparência"><button data-theme-mode="system" title="Automático">◐</button><button data-theme-mode="light" title="Claro">☼</button><button data-theme-mode="dark" title="Escuro">●</button></div>
      </div>
    </aside>
    <header class="mobile-header"><div class="audaz-mark compact"><span class="record-dot"></span><strong>AUDAZ</strong></div><div class="mobile-actions"><button id="mobileTheme" class="icon-btn" aria-label="Alternar aparência">◐</button><button id="mobileMenu" class="icon-btn" aria-label="Abrir menu">☰</button></div></header>
    <main class="main-shell">
      <div class="top-line"><div><span class="corner"></span><span class="eyebrow">PORTAL DO CLIENTE</span></div><div id="clientLogo" class="client-logo"></div></div>
      <section id="page-dashboard" class="page active"></section>
      <section id="page-conteudos" class="page"></section>
      <section id="page-calendario" class="page"></section>
      <section id="page-aprovacoes" class="page"></section>
      <section id="page-arquivos" class="page"></section>
    </main>
  </div>
  <div id="drawer" class="drawer"><div class="drawer-panel"><div class="drawer-head"><strong>MENU</strong><button id="closeDrawer">×</button></div><nav id="drawerNav"></nav></div></div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal"><div class="modal-card" id="modalCard"></div></div>
  <script src="app.js"></script>
</body>
</html>
